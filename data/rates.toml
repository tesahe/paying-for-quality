# Cited pay rates (FR-9). Small, hand-made, committed. Loaded with: pfq rates load --source cited-rates
#
# Rules (AGENTS.md section 4):
# - Every entry cites a public source (citation_url), its retrieval date and its license or terms.
#   Core rejects an entry without a citation (CITATION_MISSING).
# - Sources are papers, official statistics or guidance written for researchers. Never a company's own
#   job site or work platform, and never anything from the owner's contract work.
# - To record a changed figure, add a new entry with a new id. Loaded ids are never overwritten.
#
# Fields: id, amount (or amount_min/amount_max), unit, currency, engagement, rater_kind, domain,
#         provenance_kind, region, as_of, citation_url, citation_note (quote; retrieved date; license).

